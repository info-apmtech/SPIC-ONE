<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Temporarily Unavailable</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
    }

    body {
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
            "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(180deg, #ffffff 0%, #eef4f0 100%);
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
    }

    .unavailable-card {
        text-align: center;
        max-width: 560px;
        width: 100%;
        padding: 48px 32px;
        background: #ffffff;
        border: 1px solid #e5e9e6;
        border-top: 5px solid #0b6b3a;
        border-radius: 12px;
        box-shadow: 0 20px 45px -25px rgba(11, 107, 58, 0.28);
    }

    .brand-logo {
        display: inline-block;
        max-width: 150px;
        height: auto;
        margin-bottom: 32px;
    }

    h1 {
        font-size: 1.6rem;
        font-weight: 600;
        color: #101828;
        margin-bottom: 14px;
        line-height: 1.3;
    }

    p {
        font-size: 1rem;
        color: #4b5563;
        line-height: 1.65;
        margin: 0;
    }

    .divider {
        width: 64px;
        height: 3px;
        background: #2bb673;
        border-radius: 2px;
        margin: 24px auto 22px;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        .unavailable-card {
            padding: 36px 20px;
            border-radius: 10px;
        }

        .brand-logo {
            max-width: 120px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.35rem;
        }
    }
</style>
