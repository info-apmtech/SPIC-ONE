    <script>
        const addBtn = document.getElementById('addExperienceBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function () {
                const grid = document.getElementById('experienceGrid');
                if (!grid) return;

                const card = document.createElement('div');
                card.className = 'exp-card';
                card.innerHTML = `
                                        <div class="exp-top">
                                            <div class="exp-left">
                                                <div class="exp-icon"><i class="bi bi-building"></i></div>
                                                <div>
                                                    <div class="exp-name">New Partner Added</div>
                                                    <div class="meta-row">
                                                        <span class="badge-soft-success">Active</span>
                                                        <span class="badge-soft-warning"><i class="bi bi-clock"></i> 3 Years</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="exp-actions">
                                                <i class="bi bi-pencil-square"></i>
                                                <i class="bi bi-box-arrow-up-right"></i>
                                                <i class="bi bi-trash delete"></i>
                                            </div>
                                        </div>
                                        <div class="stats-grid">
                                            <div class="stat-box">
                                                <div class="stat-label">Total Quantity</div>
                                                <div class="stat-value">980 MT</div>
                                            </div>
                                            <div class="stat-box">
                                                <div class="stat-label">Annual Turnover</div>
                                                <div class="stat-value">₹ 46.0 Lakhs</div>
                                            </div>
                                        </div>
                                    `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('delete')) {
                e.target.closest('.exp-card')?.remove();
            }
        });
    </script>




    <script>
        var mapInstances = {};
        var dotNetRefs = {};

        window.initLeafletMap = (elementId, dotNetRef) => {
            dotNetRefs[elementId] = dotNetRef;

            if (!mapInstances[elementId]) {
                // Default View (Set to India center by default, adjust if needed)
                mapInstances[elementId] = L.map(elementId).setView([20.5937, 78.9629], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(mapInstances[elementId]);

                // Add click listener to the map
                mapInstances[elementId].on('click', function (e) {
                    var lat = e.latlng.lat;
                    var lng = e.latlng.lng;

                    // Set or move the marker
                    if (mapInstances[elementId].marker) {
                        mapInstances[elementId].marker.setLatLng([lat, lng]);
                    } else {
                        mapInstances[elementId].marker = L.marker([lat, lng]).addTo(mapInstances[elementId]);
                    }

                    // Send the new coordinates back to Blazor C# Code!
                    if (dotNetRefs[elementId]) {
                        dotNetRefs[elementId].invokeMethodAsync('UpdateLocationFromMap', lat, lng);
                    }
                });
            }
        };

        window.updateLeafletMap = (elementId, lat, lng) => {
            if (mapInstances[elementId]) {
                var map = mapInstances[elementId];
                map.setView([lat, lng], 15); // Zoom in on the location

                if (map.marker) {
                    map.marker.setLatLng([lat, lng]);
                } else {
                    map.marker = L.marker([lat, lng]).addTo(map);
                }
            }
        };

        window.getCurrentPosition = () => {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ error: "Geolocation not supported" });
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
                        (err) => resolve({ error: err.message })
                    );
                }
            });
        };
    </script>
