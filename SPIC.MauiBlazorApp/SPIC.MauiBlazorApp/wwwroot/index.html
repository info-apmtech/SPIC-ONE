<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">Loading...</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        const addBtn = document.getElementById('addExperienceBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function () {
                const grid = document.getElementById('experienceGrid');
                if (!grid) return;

                const card = document.createElement('div');
                card.className = 'exp-card';
                card.innerHTML = `
                        <div class="exp-top">
                            <div class="exp-left">
                                <div class="exp-icon"><i class="bi bi-building"></i></div>
                                <div>
                                    <div class="exp-name">New Partner Added</div>
                                    <div class="meta-row">
                                        <span class="badge-soft-success">Active</span>
                                        <span class="badge-soft-warning"><i class="bi bi-clock"></i> 3 Years</span>
                                    </div>
                                </div>
                            </div>
                            <div class="exp-actions">
                                <i class="bi bi-pencil-square"></i>
                                <i class="bi bi-box-arrow-up-right"></i>
                                <i class="bi bi-trash delete"></i>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-label">Total Quantity</div>
                                <div class="stat-value">980 MT</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Annual Turnover</div>
                                <div class="stat-value">₹ 46.0 Lakhs</div>
                            </div>
                        </div>
                    `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('delete')) {
                e.target.closest('.exp-card')?.remove();
            }
        });
    </script>
    <script src="_content/SPIC.MauiBlazorApp.Shared/js/location.js"></script>
</body>
</html>
